services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-scam-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./app/SmishingWebApp
      dockerfile: Dockerfile
    container_name: sms-scam-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - SmishingApi__BaseUrl=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped